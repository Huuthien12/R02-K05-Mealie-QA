name: GitHub-hosted Mealie P0 regression

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MEALIE_IMAGE: ghcr.io/mealie-recipes/mealie@sha256:3e57058bfcb4343bd7c43d8f04306f6d37523d06ef7e7a395ebfcfc2a752cee4
  MEALIE_RELEASE_TAG: v3.28.0
  MEALIE_PINNED_COMMIT: 0552eaa4a80031b8572849cca0ed95d07f1be001
  MEALIE_BASE_URL: http://127.0.0.1:9000

jobs:
  hosted-p0:
    # Dispatch is intentionally restricted to reviewed code on the default branch.
    if: github.ref == 'refs/heads/main'
    name: Ephemeral Mealie P0 (TC-01 to TC-11)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Compile and collect exactly the P0 inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/ci
          python -m compileall -q tests/schemathesis
          p0_files=(
            tests/schemathesis/test_p0_collections.py
            tests/schemathesis/test_p0_details.py
            tests/schemathesis/test_p0_selection.py
            tests/schemathesis/test_p0_smoke.py
          )
          python -m pytest --collect-only -q "${p0_files[@]}" | tee reports/ci/hosted-p0-collect.txt
          grep -Eq '^11 tests collected' reports/ci/hosted-p0-collect.txt
      - name: Create isolated Mealie state and temporary QA credentials
        shell: bash
        run: |
          set -euo pipefail
          suffix="$(openssl rand -hex 12)"
          password="$(openssl rand -base64 48 | tr -d '\n')"
          volume="mealie-p0-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="mealie-p0-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          docker volume create "$volume" >/dev/null
          printf '%s\n' "::add-mask::$password"
          {
            printf 'MEALIE_CONTAINER=%s\n' "$container"
            printf 'MEALIE_DATA_VOLUME=%s\n' "$volume"
            printf 'MEALIE_QA_EMAIL=qa-%s@example.invalid\n' "$suffix"
            printf 'MEALIE_QA_USERNAME=qa%s\n' "$suffix"
            printf 'MEALIE_QA_PASSWORD=%s\n' "$password"
          } >> "$GITHUB_ENV"
          cat > reports/ci/hosted-p0-metadata.txt <<EOF
          workflow_commit=${GITHUB_SHA}
          run_started_utc=$(date --utc +%Y-%m-%dT%H:%M:%SZ)
          runner_os=${RUNNER_OS}
          scope=TC-01..TC-11 (P0 read-only)
          sut_image=${MEALIE_IMAGE}
          sut_release_tag=${MEALIE_RELEASE_TAG}
          expected_source_commit=${MEALIE_PINNED_COMMIT}
          authentication=ephemeral registration plus session bearer token
          database=job-unique Docker volume using SQLite
          EOF
      - name: Start fresh Mealie with SQLite
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name "$MEALIE_CONTAINER" \
            --publish 127.0.0.1:9000:9000 \
            --volume "$MEALIE_DATA_VOLUME:/app/data" \
            --env ALLOW_SIGNUP=true \
            --env DB_ENGINE=sqlite \
            "$MEALIE_IMAGE" >/dev/null
      - name: Wait for Mealie and verify the release API
        shell: bash
        run: |
          set -euo pipefail
          about_file="$RUNNER_TEMP/mealie-p0-about.json"
          schema_file="$RUNNER_TEMP/mealie-p0-openapi.json"
          ready=false
          for _ in $(seq 1 90); do
            if curl --fail --silent --show-error --max-time 5 "$MEALIE_BASE_URL/api/app/about" --output "$about_file" \
              && curl --fail --silent --show-error --max-time 5 "$MEALIE_BASE_URL/openapi.json" --output "$schema_file"; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            docker logs --tail 200 "$MEALIE_CONTAINER" >&2 || true
            exit 1
          fi
          runtime_version="$(python - "$about_file" "$schema_file" <<'PY'
          import json
          import sys

          about = json.load(open(sys.argv[1], encoding="utf-8"))
          schema = json.load(open(sys.argv[2], encoding="utf-8"))
          version = about.get("version")
          if version not in {"3.28.0", "v3.28.0"}:
              raise SystemExit(f"Unexpected Mealie runtime version: {version!r}")
          if schema.get("openapi") != "3.1.0":
              raise SystemExit(f"Unexpected OpenAPI version: {schema.get('openapi')!r}")
          print(version)
          PY
          )"
          printf 'MEALIE_RUNTIME_VERSION=%s\n' "$runtime_version" >> "$GITHUB_ENV"
          printf 'runtime_version=%s\nopenapi_version=3.1.0\n' "$runtime_version" >> reports/ci/hosted-p0-metadata.txt
          rm -f "$about_file" "$schema_file"
      - name: Bootstrap and verify ephemeral QA authentication
        shell: bash
        run: |
          set -euo pipefail
          registration_file="$RUNNER_TEMP/mealie-p0-registration.json"
          token_file="$RUNNER_TEMP/mealie-p0-token.json"
          registration_payload="$(python - <<'PY'
          import json
          import os

          print(json.dumps({
              "email": os.environ["MEALIE_QA_EMAIL"],
              "username": os.environ["MEALIE_QA_USERNAME"],
              "fullName": "GitHub Hosted QA",
              "password": os.environ["MEALIE_QA_PASSWORD"],
              "passwordConfirm": os.environ["MEALIE_QA_PASSWORD"],
              "group": "GitHub Hosted QA",
              "household": "Regression",
              "seedData": False,
          }))
          PY
          )"
          register_status="$(curl --silent --show-error --output "$registration_file" --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data "$registration_payload" \
            "$MEALIE_BASE_URL/api/users/register")"
          if [[ "$register_status" != 201 ]]; then
            rm -f "$registration_file"
            printf 'Bootstrap registration failed with HTTP %s.\n' "$register_status" >&2
            exit 1
          fi
          token_status="$(curl --silent --show-error --output "$token_file" --write-out '%{http_code}' \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "username=$MEALIE_QA_USERNAME" \
            --data-urlencode "password=$MEALIE_QA_PASSWORD" \
            --data-urlencode 'remember_me=false' \
            "$MEALIE_BASE_URL/api/auth/token")"
          if [[ "$token_status" != 200 ]]; then
            rm -f "$registration_file" "$token_file"
            printf 'Bootstrap authentication failed with HTTP %s.\n' "$token_status" >&2
            exit 1
          fi
          token="$(python - "$token_file" <<'PY'
          import json
          import sys

          token = json.load(open(sys.argv[1], encoding="utf-8")).get("access_token")
          if not token:
              raise SystemExit("Token response did not contain access_token")
          print(token)
          PY
          )"
          printf '%s\n' "::add-mask::$token"
          printf 'MEALIE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          self_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $token" "$MEALIE_BASE_URL/api/users/self")"
          rm -f "$registration_file" "$token_file"
          if [[ "$self_status" != 200 ]]; then
            printf 'Ephemeral bearer token was rejected with HTTP %s.\n' "$self_status" >&2
            exit 1
          fi
          printf 'bootstrap_registration=201\nbootstrap_token=200\nauthenticated_self=200\n' >> reports/ci/hosted-p0-metadata.txt
      - name: Run P0 and retain real contract failures
        id: p0
        continue-on-error: true
        shell: bash
        run: >-
          python -m pytest
          tests/schemathesis/test_p0_selection.py
          tests/schemathesis/test_p0_collections.py
          tests/schemathesis/test_p0_details.py
          tests/schemathesis/test_p0_smoke.py
          -q -rs --junitxml reports/ci/hosted-p0.xml
      - name: Redact the ephemeral token from JUnit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f reports/ci/hosted-p0.xml ]]; then
            python - <<'PY'
          import os
          import pathlib

          path = pathlib.Path("reports/ci/hosted-p0.xml")
          token = os.environ.get("MEALIE_API_TOKEN")
          if token:
              path.write_text(path.read_text(encoding="utf-8").replace(token, "[REDACTED]"), encoding="utf-8")
          PY
          fi
      - name: Summarize P0 JUnit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee reports/ci/hosted-p0-summary.txt
          import pathlib
          import xml.etree.ElementTree as ET

          path = pathlib.Path("reports/ci/hosted-p0.xml")
          if not path.is_file():
              raise SystemExit("P0 JUnit was not generated")
          root = ET.parse(path).getroot()
          suites = root.findall("testsuite") if root.tag == "testsuites" else [root]
          totals = {key: sum(int(suite.attrib.get(key, 0)) for suite in suites) for key in ("tests", "failures", "errors", "skipped")}
          if totals["tests"] != 11:
              raise SystemExit(f"Expected 11 P0 items, got {totals['tests']}")
          passed = totals["tests"] - totals["failures"] - totals["errors"] - totals["skipped"]
          print(f"TC-01..TC-11: PASS={passed} FAIL={totals['failures']} SKIP={totals['skipped']} ERROR={totals['errors']}")
          PY
          {
            echo "## GitHub-hosted Mealie P0"
            cat reports/ci/hosted-p0-summary.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload P0 JUnit and metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mealie-hosted-p0-${{ github.run_id }}
          path: |
            reports/ci/hosted-p0.xml
            reports/ci/hosted-p0-summary.txt
            reports/ci/hosted-p0-metadata.txt
            reports/ci/hosted-p0-collect.txt
          if-no-files-found: warn
      - name: Preserve P0 test verdict
        if: always() && steps.p0.outcome == 'failure'
        shell: bash
        run: exit 1
      - name: Remove job-only Mealie state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          expected_name="mealie-p0-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ "${MEALIE_CONTAINER:-}" == "$expected_name" ]]; then
            docker rm --force "$MEALIE_CONTAINER" >/dev/null 2>&1 || true
          else
            printf '%s\n' 'Skipping an unexpected Docker container name.' >&2
          fi
          if [[ "${MEALIE_DATA_VOLUME:-}" == "$expected_name" ]]; then
            docker volume rm "$MEALIE_DATA_VOLUME" >/dev/null 2>&1 || true
          else
            printf '%s\n' 'Skipping an unexpected Docker volume name.' >&2
          fi
