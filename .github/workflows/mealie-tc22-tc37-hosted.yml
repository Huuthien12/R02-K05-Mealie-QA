name: GitHub-hosted Mealie TC-22 to TC-37 regression

on:
  workflow_dispatch:
    inputs:
      confirm_disposable_expansion:
        description: "Confirm TC-22..TC-37 may write only to this job's fresh disposable Mealie database"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  MEALIE_IMAGE: ghcr.io/mealie-recipes/mealie@sha256:3e57058bfcb4343bd7c43d8f04306f6d37523d06ef7a7a395ebfcfc2a752cee4
  MEALIE_RELEASE_TAG: v3.28.0
  MEALIE_PINNED_COMMIT: 0552eaa4a80031b8572849cca0ed95d07f1be001
  MEALIE_BASE_URL: http://127.0.0.1:9000

jobs:
  hosted-expansion:
    # Write tests are limited to reviewed default-branch code and an explicit dispatch gate.
    if: github.ref == 'refs/heads/main' && inputs.confirm_disposable_expansion
    name: Disposable Mealie expansion (TC-22 to TC-37)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Compile and collect exactly the expansion inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/ci
          expansion_files=(
            tests/schemathesis/test_tc22_tc25_shopping_lists.py
            tests/schemathesis/test_tc26_tc29_mealplans.py
            tests/schemathesis/test_tc30_tc33_shopping_items.py
            tests/schemathesis/test_tc34_tc37_recipes.py
          )
          python -m py_compile "${expansion_files[@]}" tests/schemathesis/tc22_tc37_helpers.py
          python -m pytest --collect-only -q "${expansion_files[@]}" | tee reports/ci/hosted-tc22-tc37-collect.txt
          grep -Eq '^16 tests collected' reports/ci/hosted-tc22-tc37-collect.txt
          if grep -Eq 'test_p[01]_' reports/ci/hosted-tc22-tc37-collect.txt; then
            echo "Historical P0/P1 inventory leaked into the expansion campaign." >&2
            exit 1
          fi
      - name: Create isolated Mealie state
        shell: bash
        run: |
          set -euo pipefail
          volume="mealie-tc22-tc37-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="mealie-tc22-tc37-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$volume" >/dev/null
          {
            printf 'MEALIE_CONTAINER=%s\n' "$container"
            printf 'MEALIE_DATA_VOLUME=%s\n' "$volume"
          } >> "$GITHUB_ENV"
          cat > reports/ci/hosted-tc22-tc37-metadata.txt <<EOF
          workflow_commit=${GITHUB_SHA}
          run_started_utc=$(date --utc +%Y-%m-%dT%H:%M:%SZ)
          runner_os=${RUNNER_OS}
          scope=TC-22..TC-37 (controlled writes; MEALIE_RUN_P1_EXPANSION=1 only for pytest)
          sut_image=${MEALIE_IMAGE}
          sut_release_tag=${MEALIE_RELEASE_TAG}
          expected_source_commit=${MEALIE_PINNED_COMMIT}
          authentication=ephemeral registration plus session bearer token
          database=job-unique Docker volume using SQLite
          EOF
      - name: Verify and pull the pinned Mealie image
        shell: bash
        run: |
          set -euo pipefail
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'
          docker manifest inspect "$MEALIE_IMAGE" >/dev/null
          docker pull --quiet "$MEALIE_IMAGE" >/dev/null
          printf 'image_manifest=resolved\nimage_pull=completed\n' >> reports/ci/hosted-tc22-tc37-metadata.txt
      - name: Start fresh Mealie with SQLite
        shell: bash
        run: |
          set -euo pipefail
          if ! docker run --detach --name "$MEALIE_CONTAINER" \
            --publish 127.0.0.1:9000:9000 \
            --volume "$MEALIE_DATA_VOLUME:/app/data" \
            --env ALLOW_SIGNUP=true \
            --env DB_ENGINE=sqlite \
            "$MEALIE_IMAGE" >/dev/null; then
            docker ps --all --filter "name=^/${MEALIE_CONTAINER}$" --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' >&2 || true
            exit 1
          fi
      - name: Wait for Mealie and verify the release API
        shell: bash
        run: |
          set -euo pipefail
          about_file="$RUNNER_TEMP/mealie-expansion-about.json"
          schema_file="$RUNNER_TEMP/mealie-expansion-openapi.json"
          ready=false
          for _ in $(seq 1 90); do
            if curl --fail --silent --show-error --max-time 5 "$MEALIE_BASE_URL/api/app/about" --output "$about_file" \
              && curl --fail --silent --show-error --max-time 5 "$MEALIE_BASE_URL/openapi.json" --output "$schema_file"; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            docker logs --tail 200 "$MEALIE_CONTAINER" >&2 || true
            exit 1
          fi
          runtime_version="$(python - "$about_file" "$schema_file" <<'PY'
          import json
          import sys

          about = json.load(open(sys.argv[1], encoding="utf-8"))
          schema = json.load(open(sys.argv[2], encoding="utf-8"))
          version = about.get("version")
          if version not in {"3.28.0", "v3.28.0"}:
              raise SystemExit(f"Unexpected Mealie runtime version: {version!r}")
          if schema.get("openapi") != "3.1.0":
              raise SystemExit(f"Unexpected OpenAPI version: {schema.get('openapi')!r}")
          print(version)
          PY
          )"
          printf 'MEALIE_RUNTIME_VERSION=%s\n' "$runtime_version" >> "$GITHUB_ENV"
          printf 'runtime_version=%s\nopenapi_version=3.1.0\n' "$runtime_version" >> reports/ci/hosted-tc22-tc37-metadata.txt
          rm -f "$about_file" "$schema_file"
      - name: Bootstrap and verify ephemeral QA authentication
        shell: bash
        run: |
          set -euo pipefail
          registration_file="$RUNNER_TEMP/mealie-expansion-registration.json"
          token_file="$RUNNER_TEMP/mealie-expansion-token.json"
          suffix="$(openssl rand -hex 12)"
          email="qa-${suffix}@example.invalid"
          username="qa${suffix}"
          password="$(openssl rand -base64 48 | tr -d '\n')"
          printf '%s\n' "::add-mask::$password"
          registration_payload="$(MEALIE_QA_EMAIL="$email" MEALIE_QA_USERNAME="$username" MEALIE_QA_PASSWORD="$password" python - <<'PY'
          import json
          import os

          print(json.dumps({
              "email": os.environ["MEALIE_QA_EMAIL"],
              "username": os.environ["MEALIE_QA_USERNAME"],
              "fullName": "GitHub Hosted QA",
              "password": os.environ["MEALIE_QA_PASSWORD"],
              "passwordConfirm": os.environ["MEALIE_QA_PASSWORD"],
              "group": "GitHub Hosted QA",
              "household": "Regression",
              "seedData": False,
          }))
          PY
          )"
          register_status="$(curl --silent --show-error --output "$registration_file" --write-out '%{http_code}' \
            --header 'Content-Type: application/json' --data "$registration_payload" \
            "$MEALIE_BASE_URL/api/users/register")"
          if [[ "$register_status" != 201 ]]; then
            rm -f "$registration_file"
            printf 'Bootstrap registration failed with HTTP %s.\n' "$register_status" >&2
            exit 1
          fi
          token_status="$(curl --silent --show-error --output "$token_file" --write-out '%{http_code}' \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "username=$username" --data-urlencode "password=$password" \
            --data-urlencode 'remember_me=false' "$MEALIE_BASE_URL/api/auth/token")"
          if [[ "$token_status" != 200 ]]; then
            rm -f "$registration_file" "$token_file"
            printf 'Bootstrap authentication failed with HTTP %s.\n' "$token_status" >&2
            exit 1
          fi
          token="$(python - "$token_file" <<'PY'
          import json
          import sys

          token = json.load(open(sys.argv[1], encoding="utf-8")).get("access_token")
          if not token:
              raise SystemExit("Token response did not contain access_token")
          print(token)
          PY
          )"
          printf '%s\n' "::add-mask::$token"
          printf 'MEALIE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          self_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $token" "$MEALIE_BASE_URL/api/users/self")"
          rm -f "$registration_file" "$token_file"
          if [[ "$self_status" != 200 ]]; then
            printf 'Ephemeral bearer token was rejected with HTTP %s.\n' "$self_status" >&2
            exit 1
          fi
          printf 'bootstrap_registration=201\nbootstrap_token=200\nauthenticated_self=200\n' >> reports/ci/hosted-tc22-tc37-metadata.txt
      - name: Verify fresh expansion data baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee reports/ci/hosted-tc22-tc37-cleanup.txt
          import json
          import os
          import urllib.request

          resources = {
              "recipes": "/api/recipes?perPage=100",
              "shopping_lists": "/api/households/shopping/lists?perPage=100",
              "shopping_items": "/api/households/shopping/items?perPage=100",
              "mealplans": "/api/households/mealplans?perPage=100",
          }
          headers = {"Authorization": f"Bearer {os.environ['MEALIE_API_TOKEN']}"}
          for name, path in resources.items():
              request = urllib.request.Request(os.environ["MEALIE_BASE_URL"] + path, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  body = json.load(response)
              items = body.get("items", []) if isinstance(body, dict) else body
              count = len(items)
              print(f"pre_{name}_count={count}")
              if count:
                  raise SystemExit(f"Expansion stopped: fresh QA baseline has {count} {name}.")
          print("pre_campaign_data_audit=empty")
          PY
      - name: Run TC-22 to TC-37 and retain real test failures
        id: expansion
        continue-on-error: true
        shell: bash
        env:
          MEALIE_RUN_P1_EXPANSION: "1"
        run: >-
          python -m pytest
          tests/schemathesis/test_tc22_tc25_shopping_lists.py
          tests/schemathesis/test_tc26_tc29_mealplans.py
          tests/schemathesis/test_tc30_tc33_shopping_items.py
          tests/schemathesis/test_tc34_tc37_recipes.py
          -q -rs --junitxml reports/ci/hosted-tc22-tc37.xml
      - name: Redact the ephemeral token from JUnit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f reports/ci/hosted-tc22-tc37.xml ]]; then
            python - <<'PY'
          import os
          import pathlib

          path = pathlib.Path("reports/ci/hosted-tc22-tc37.xml")
          token = os.environ.get("MEALIE_API_TOKEN")
          if token:
              path.write_text(path.read_text(encoding="utf-8").replace(token, "[REDACTED]"), encoding="utf-8")
          PY
          fi
      - name: Verify expansion test data cleanup
        id: data_audit
        if: always() && env.MEALIE_API_TOKEN != ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee -a reports/ci/hosted-tc22-tc37-cleanup.txt
          import json
          import os
          import urllib.request

          resources = {
              "recipes": "/api/recipes?perPage=100",
              "shopping_lists": "/api/households/shopping/lists?perPage=100",
              "shopping_items": "/api/households/shopping/items?perPage=100",
              "mealplans": "/api/households/mealplans?perPage=100",
          }
          headers = {"Authorization": f"Bearer {os.environ['MEALIE_API_TOKEN']}"}
          for name, path in resources.items():
              request = urllib.request.Request(os.environ["MEALIE_BASE_URL"] + path, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  body = json.load(response)
              items = body.get("items", []) if isinstance(body, dict) else body
              count = len(items)
              print(f"post_{name}_count={count}")
              if count:
                  raise SystemExit(f"Expansion cleanup verification failed: {count} {name} remain.")
          print("post_campaign_data_audit=empty")
          PY
      - name: Summarize expansion JUnit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee reports/ci/hosted-tc22-tc37-summary.txt
          import pathlib
          import xml.etree.ElementTree as ET

          path = pathlib.Path("reports/ci/hosted-tc22-tc37.xml")
          if not path.is_file():
              print("TC-22..TC-37: NOT RUN (JUnit unavailable; inspect the earlier setup failure)")
              raise SystemExit(0)
          root = ET.parse(path).getroot()
          suites = root.findall("testsuite") if root.tag == "testsuites" else [root]
          totals = {key: sum(int(suite.attrib.get(key, 0)) for suite in suites) for key in ("tests", "failures", "errors", "skipped")}
          if totals["tests"] != 16:
              raise SystemExit(f"Expected 16 expansion items, got {totals['tests']}")
          passed = totals["tests"] - totals["failures"] - totals["errors"] - totals["skipped"]
          print(f"TC-22..TC-37: PASS={passed} FAIL={totals['failures']} SKIP={totals['skipped']} ERROR={totals['errors']}")
          PY
          {
            echo "## GitHub-hosted Mealie TC-22 to TC-37"
            cat reports/ci/hosted-tc22-tc37-summary.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove job-only Mealie state
        id: teardown
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          expected_name="mealie-tc22-tc37-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          failed=0
          {
            echo "teardown_started_utc=$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
            if [[ "${MEALIE_CONTAINER:-}" == "$expected_name" ]]; then
              if docker rm --force "$MEALIE_CONTAINER" >/dev/null 2>&1; then echo "container_cleanup=removed"; else echo "container_cleanup=failed"; failed=1; fi
            else echo "container_cleanup=not-created"; fi
            if [[ "${MEALIE_DATA_VOLUME:-}" == "$expected_name" ]]; then
              if docker volume rm "$MEALIE_DATA_VOLUME" >/dev/null 2>&1; then echo "volume_cleanup=removed"; else echo "volume_cleanup=failed"; failed=1; fi
            else echo "volume_cleanup=not-created"; fi
          } >> reports/ci/hosted-tc22-tc37-cleanup.txt
          exit "$failed"
      - name: Upload expansion JUnit and cleanup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mealie-hosted-tc22-tc37-${{ github.run_id }}
          path: |
            reports/ci/hosted-tc22-tc37.xml
            reports/ci/hosted-tc22-tc37-summary.txt
            reports/ci/hosted-tc22-tc37-metadata.txt
            reports/ci/hosted-tc22-tc37-collect.txt
            reports/ci/hosted-tc22-tc37-cleanup.txt
          if-no-files-found: warn
      - name: Preserve expansion and cleanup verdicts
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.expansion.outcome }}" == "failure" || "${{ steps.data_audit.outcome }}" == "failure" || "${{ steps.teardown.outcome }}" == "failure" ]]; then
            exit 1
          fi
